name: Prepare v0.19.1

on:
  push:
    branches:
      - "release-prep/v0.19.1"
    paths:
      - ".github/workflows/release-prep-v0.19.1.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Bump package metadata
        run: npm version 0.19.1 --no-git-tag-version

      - name: Finalize changelog
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "CHANGELOG.md";
          let text = fs.readFileSync(path, "utf8");
          const heading = "## 0.19.1 - 2026-09-07";
          if (!text.includes(heading)) {
            const marker = "## Unreleased\n\n";
            if (!text.includes(marker)) throw new Error("Unreleased changelog heading not found");
            text = text.replace(marker, `${marker}${heading}\n\n`);
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Commit release preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git diff --cached --check
          git commit -m "chore: prepare v0.19.1"
          git push origin HEAD:"$GITHUB_REF_NAME"
