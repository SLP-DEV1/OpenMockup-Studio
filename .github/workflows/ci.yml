name: CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "hardening/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.0
            label: ubuntu-node20
          - os: ubuntu-latest
            node: 22.19.0
            label: ubuntu-node22
          - os: windows-latest
            node: 22.19.0
            label: windows-node22
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build static demo
        run: npm run build:demo

  browser-smoke:
    name: Browser export smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo at root path
        run: npm run build:demo
        env:
          OPENMOCKUP_BASE_PATH: /

      - name: Install pinned browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser export smoke
        run: node scripts/e2e-demo.mjs
