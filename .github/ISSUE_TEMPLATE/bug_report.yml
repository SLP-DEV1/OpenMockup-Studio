name: Bug report
description: Report a reproducible problem in OpenMockup Studio
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OpenMockup Studio. Please do not attach private customer artwork or licensed mockup files.
  - type: dropdown
    id: mode
    attributes:
      label: Rendering mode
      options:
        - Flat image (PNG/JPG/WebP)
        - PSD / Photopea
        - Both / not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js version, and OpenMockup Studio version or commit.
      placeholder: "Windows 11, Chrome 151, Node 22.x, main@abc1234"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start with ...
        2. Add ...
        3. Click ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets, tunnel URLs, customer data, and copyrighted assets before posting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first.
          required: true
        - label: I can reproduce this with assets I am allowed to share, or without attaching the source assets.
          required: true
